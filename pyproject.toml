[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idira-epm-policy-splitter"
version = "0.2.0"
description = "Split Idira EPM policy exports so no policy exceeds the importer's definition limit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []  # standard library only

[project.scripts]
epm-policy-splitter = "epm_policy_splitter:main"

[tool.setuptools]
py-modules = ["epm_policy_splitter"]
